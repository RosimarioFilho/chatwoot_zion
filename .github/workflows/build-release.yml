# Salve este arquivo em: .github/workflows/build-release.yml (dentro do seu fork)
#
# O que ele faz:
# - Dispara sozinho toda vez que você criar uma tag "vX.Y.Z" no seu fork
#   (ex: git tag v1.1.0 && git push --tags)
# - Builda a imagem Docker usando o Dockerfile que já existe no repositório do Chatwoot
# - Publica no GitHub Container Registry (ghcr.io), privado por padrão
# - Depois disso, você só troca a tag no Portainer (variável ZION_VERSION do stack)
#
# Também permite disparo manual (workflow_dispatch), útil pra testar antes de criar a tag oficial.

name: Build e Publicar Imagem Zion

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da imagem (ex: 1.1.0-teste)'
        required: true
        default: 'manual-test'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/zion

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # necessário para publicar no ghcr.io

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir a tag da imagem
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ────────────────────────────────────────────────────────────
# PRÉ-REQUISITOS (fazer uma única vez):
#
# 1. Nenhum secret extra é necessário pro ghcr.io — o GITHUB_TOKEN
#    já vem automático em qualquer repositório.
# 2. Na primeira publicação, o pacote nasce PRIVADO. Se o Portainer
#    for puxar a imagem, o VPS precisa estar autenticado:
#      docker login ghcr.io -u SEU_USUARIO -p SEU_TOKEN_GITHUB
#    (gere um Personal Access Token com escopo "read:packages")
# 3. Depois disso o ciclo completo fica:
#      git tag v1.1.0 && git push --tags   → Actions builda e publica sozinho
#      Portainer: troca ZION_VERSION para 1.1.0 → Update the stack
# ────────────────────────────────────────────────────────────
